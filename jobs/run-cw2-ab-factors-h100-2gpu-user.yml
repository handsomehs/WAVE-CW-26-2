apiVersion: batch/v1
kind: Job
metadata:
  generateName: awave-cw2-factor-ab-h100-2g-uq-
  labels:
    kueue.x-k8s.io/queue-name: eidf018ns-user-queue
spec:
  completions: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      name: awave-cw2-factor-ab-h100-2g-uq
    spec:
      activeDeadlineSeconds: 3600
      containers:
      - name: run
        image: $container
        env:
          - name: AWAVE_MPI_MODE
            value: device
          - name: OMPI_MCA_coll_hcoll_enable
            value: "0"
          - name: OMPI_MCA_coll_ucc_enable
            value: "0"
        command:
          - bash
          - -lc
          - >-
            set -euo pipefail;
            cd /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2;
            if [ ! -d build-cuda ]; then
              cmake -S src -B build-cuda -DAWAVE_MODE=CUDA -DCMAKE_BUILD_TYPE=Release;
            fi;
            cmake --build build-cuda -j;
            nvidia-smi -L;
            python3 -c 'import ctypes,sys; lib=ctypes.CDLL("libcuda.so"); cuInit=lib.cuInit; cuInit.argtypes=[ctypes.c_uint]; cuInit.restype=ctypes.c_int; cuDeviceGetCount=lib.cuDeviceGetCount; cuDeviceGetCount.argtypes=[ctypes.c_void_p]; cuDeviceGetCount.restype=ctypes.c_int; n=ctypes.c_int(-1); rc=cuInit(0); rc2=cuDeviceGetCount(ctypes.byref(n)) if rc==0 else -1; print(f"cuda_sanity cuInit={rc} cuDeviceGetCount={rc2} count={n.value}"); sys.exit(0 if rc==0 and rc2==0 and n.value>0 else 1)';
            mkdir -p /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq;
            echo "===== RUN base_r1 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=6 AWAVE_CUDA_DAMP_BRANCHLESS=1 AWAVE_CUDA_ZPAD=1 stdbuf -oL -eL mpirun -np 2 build-cuda/awave -skip_cpu 1 -mpi 2,1,1 -shape 768,768,768 -nsteps 12 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/base_r1.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/base_r1;
            echo "===== RUN base_r2 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=6 AWAVE_CUDA_DAMP_BRANCHLESS=1 AWAVE_CUDA_ZPAD=1 stdbuf -oL -eL mpirun -np 2 build-cuda/awave -skip_cpu 1 -mpi 2,1,1 -shape 768,768,768 -nsteps 12 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/base_r2.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/base_r2;
            echo "===== RUN damp_off_r1 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=6 AWAVE_CUDA_DAMP_BRANCHLESS=0 AWAVE_CUDA_ZPAD=1 stdbuf -oL -eL mpirun -np 2 build-cuda/awave -skip_cpu 1 -mpi 2,1,1 -shape 768,768,768 -nsteps 12 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/damp_off_r1.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/damp_off_r1;
            echo "===== RUN damp_off_r2 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=6 AWAVE_CUDA_DAMP_BRANCHLESS=0 AWAVE_CUDA_ZPAD=1 stdbuf -oL -eL mpirun -np 2 build-cuda/awave -skip_cpu 1 -mpi 2,1,1 -shape 768,768,768 -nsteps 12 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/damp_off_r2.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/damp_off_r2;
            echo "===== RUN zpad_off_r1 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=6 AWAVE_CUDA_DAMP_BRANCHLESS=1 AWAVE_CUDA_ZPAD=0 stdbuf -oL -eL mpirun -np 2 build-cuda/awave -skip_cpu 1 -mpi 2,1,1 -shape 768,768,768 -nsteps 12 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/zpad_off_r1.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/zpad_off_r1;
            echo "===== RUN zpad_off_r2 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=6 AWAVE_CUDA_DAMP_BRANCHLESS=1 AWAVE_CUDA_ZPAD=0 stdbuf -oL -eL mpirun -np 2 build-cuda/awave -skip_cpu 1 -mpi 2,1,1 -shape 768,768,768 -nsteps 12 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/zpad_off_r2.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq/zpad_off_r2;
            ls -lh /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-factor-ab-h100-2g-uq;
