apiVersion: batch/v1
kind: Job
metadata:
  generateName: awave-cw2-tune-h100-1g-pq-
  labels:
    kueue.x-k8s.io/max-exec-time-seconds: "300"
    kueue.x-k8s.io/queue-name: eidf018ns-profiling-queue
spec:
  completions: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      name: awave-cw2-tune-h100-1g-pq
    spec:
      activeDeadlineSeconds: 300
      containers:
      - name: run
        image: $container
        env:
          - name: AWAVE_MPI_MODE
            value: device
          - name: OMPI_MCA_coll_hcoll_enable
            value: "0"
          - name: OMPI_MCA_coll_ucc_enable
            value: "0"
        command:
          - bash
          - -lc
          - >-
            set -euo pipefail;
            cd /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2;
            if [ ! -x build-cuda/awave ]; then
              cmake -S src -B build-cuda -DAWAVE_MODE=CUDA -DCMAKE_BUILD_TYPE=Release;
              cmake --build build-cuda -j;
            fi;
            nvidia-smi -L;
            python3 -c 'import ctypes,sys; lib=ctypes.CDLL("libcuda.so"); cuInit=lib.cuInit; cuInit.argtypes=[ctypes.c_uint]; cuInit.restype=ctypes.c_int; cuDeviceGetCount=lib.cuDeviceGetCount; cuDeviceGetCount.argtypes=[ctypes.c_void_p]; cuDeviceGetCount.restype=ctypes.c_int; n=ctypes.c_int(-1); rc=cuInit(0); rc2=cuDeviceGetCount(ctypes.byref(n)) if rc==0 else -1; print(f"cuda_sanity cuInit={rc} cuDeviceGetCount={rc2} count={n.value}"); sys.exit(0 if rc==0 and rc2==0 and n.value>0 else 1)';
            mkdir -p /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq;
            echo "===== RUN tile0_blk0 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=0 stdbuf -oL -eL mpirun -np 1 build-cuda/awave -skip_cpu 1 -mpi 1,1,1 -shape 512,512,512 -nsteps 4 -out_period 2 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile0_blk0.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile0_blk0;
            echo "===== RUN tile0_blk1 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=1 stdbuf -oL -eL mpirun -np 1 build-cuda/awave -skip_cpu 1 -mpi 1,1,1 -shape 512,512,512 -nsteps 4 -out_period 2 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile0_blk1.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile0_blk1;
            echo "===== RUN tile0_blk2 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=0 AWAVE_CUDA_BLOCK=2 stdbuf -oL -eL mpirun -np 1 build-cuda/awave -skip_cpu 1 -mpi 1,1,1 -shape 512,512,512 -nsteps 4 -out_period 2 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile0_blk2.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile0_blk2;
            echo "===== RUN tile1_blk0 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=1 AWAVE_CUDA_BLOCK=0 stdbuf -oL -eL mpirun -np 1 build-cuda/awave -skip_cpu 1 -mpi 1,1,1 -shape 512,512,512 -nsteps 4 -out_period 2 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile1_blk0.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile1_blk0;
            echo "===== RUN tile1_blk1 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=1 AWAVE_CUDA_BLOCK=1 stdbuf -oL -eL mpirun -np 1 build-cuda/awave -skip_cpu 1 -mpi 1,1,1 -shape 512,512,512 -nsteps 4 -out_period 2 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile1_blk1.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile1_blk1;
            echo "===== RUN tile1_blk2 =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_CUDA_TILE=1 AWAVE_CUDA_BLOCK=2 stdbuf -oL -eL mpirun -np 1 build-cuda/awave -skip_cpu 1 -mpi 1,1,1 -shape 512,512,512 -nsteps 4 -out_period 2 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile1_blk2.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq/tile1_blk2;
            ls -lh /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-tune-h100-1g-pq;
        resources:
          requests:
            cpu: 4
            memory: 24Gi
            nvidia.com/gpu: 1
          limits:
            cpu: 4
            memory: 24Gi
            nvidia.com/gpu: 1
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - gpu8-vm42
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
