apiVersion: batch/v1
kind: Job
metadata:
  generateName: awave-cw2-boundary-ab-h100-8g-uq-
  labels:
    kueue.x-k8s.io/queue-name: eidf018ns-user-queue
spec:
  completions: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      name: awave-cw2-boundary-ab-h100-8g-uq
    spec:
      activeDeadlineSeconds: 3600
      containers:
      - name: run
        image: $container
        env:
          - name: AWAVE_MPI_MODE
            value: device
          - name: OMPI_MCA_coll_hcoll_enable
            value: "0"
          - name: OMPI_MCA_coll_ucc_enable
            value: "0"
        command:
          - bash
          - -lc
          - >-
            set -euo pipefail;
            cd /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2;
            if [ ! -x build-cuda/awave ]; then
              cmake -S src -B build-cuda -DAWAVE_MODE=CUDA -DCMAKE_BUILD_TYPE=Release;
              cmake --build build-cuda -j;
            fi;
            mkdir -p /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-boundary-ab-h100-8g-uq;
            echo "===== BOUNDARY_SPLIT OFF (AWAVE_CUDA_BOUNDARY_SPLIT=0) =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_MPI_WAITSOME=0 AWAVE_CUDA_BOUNDARY_SPLIT=0 stdbuf -oL -eL mpirun -np 8 build-cuda/awave -skip_cpu 1 -mpi 2,2,2 -shape 768,768,768 -nsteps 6 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-boundary-ab-h100-8g-uq/boundary0.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-boundary-ab-h100-8g-uq/boundary0;
            echo "===== BOUNDARY_SPLIT ON (AWAVE_CUDA_BOUNDARY_SPLIT=1) =====";
            AWAVE_CUDA_OVERLAP=1 AWAVE_MPI_WAITSOME=0 AWAVE_CUDA_BOUNDARY_SPLIT=1 stdbuf -oL -eL mpirun -np 8 build-cuda/awave -skip_cpu 1 -mpi 2,2,2 -shape 768,768,768 -nsteps 6 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-boundary-ab-h100-8g-uq/boundary1.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-boundary-ab-h100-8g-uq/boundary1;
            ls -lh /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/awave-cw2-boundary-ab-h100-8g-uq;
        resources:
          requests:
            cpu: 16
            memory: 128Gi
            nvidia.com/gpu: 8
          limits:
            cpu: 16
            memory: 128Gi
            nvidia.com/gpu: 8
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3