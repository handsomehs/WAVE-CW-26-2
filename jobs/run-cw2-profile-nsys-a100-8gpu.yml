apiVersion: batch/v1
kind: Job
metadata:
  generateName: awave-cw2-nsys-a100-8g-
  labels:
    kueue.x-k8s.io/max-exec-time-seconds: "300"
    kueue.x-k8s.io/queue-name: eidf018ns-profiling-queue
spec:
  completions: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      name: awave-cw2-nsys-a100-8g
    spec:
      activeDeadlineSeconds: 300
      containers:
      - name: run
        image: $container
        env:
          - name: HOME
            value: /home/eidf018/eidf018/shared/s2792840-epcc-pvc
          - name: AWAVE_MPI_MODE
            value: host
        command:
          - bash
          - -lc
          - >-
            set -euo pipefail;
            cd /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2;
            if [ ! -x build-cuda/awave ]; then
              cmake -S src -B build-cuda -DAWAVE_MODE=CUDA -DCMAKE_BUILD_TYPE=Release;
              cmake --build build-cuda -j;
            fi;
            if ! command -v nsys >/dev/null 2>&1; then
              echo "nsys not found in container PATH";
              exit 127;
            fi;
            mkdir -p /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys;
            nsys profile -f true --trace=cuda,nvtx,mpi --sample=none -o /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8 -- mpirun --mca coll_hcoll_enable 0 --mca coll_ucc_enable 0 --mca pml ob1 --mca btl self,vader,tcp -np 8 build-cuda/awave -skip_cpu 1 -mpi 2,2,2 -shape 768,768,768 -nsteps 6 -out_period 3 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8;
            nsys stats --force-export=true --format csv --report cuda_gpu_kern_sum,mpi_event_sum,cuda_kern_exec_trace,mpi_event_trace --output /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8_stats /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8.nsys-rep;
            python3 tools/nsys_overlap_evidence.py --kernel-sum /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8_stats_cuda_gpu_kern_sum.csv --mpi-sum /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8_stats_mpi_event_sum.csv --label a100_np8 --out /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8_overlap.txt;
            cat /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np8_overlap.txt;
            ls -lh /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys;
        resources:
          requests:
            cpu: 16
            memory: 96Gi
            nvidia.com/gpu: 8
          limits:
            cpu: 16
            memory: 96Gi
            nvidia.com/gpu: 8
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB
