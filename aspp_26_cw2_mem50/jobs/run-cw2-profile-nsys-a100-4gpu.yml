apiVersion: batch/v1
kind: Job
metadata:
  generateName: awave-cw2-nsys-a100-4g-
  labels:
    kueue.x-k8s.io/max-exec-time-seconds: "600"
    kueue.x-k8s.io/queue-name: eidf018ns-profiling-queue
spec:
  completions: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      name: awave-cw2-nsys-a100-4g
    spec:
      activeDeadlineSeconds: 600
      containers:
      - name: run
        image: $container
        env:
          - name: HOME
            value: /home/eidf018/eidf018/shared/s2792840-epcc-pvc
          - name: AWAVE_MPI_MODE
            value: device
        command:
          - bash
          - -lc
          - >-
            set -euo pipefail;
            cd /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2;
            if [ ! -x build-cuda/awave ]; then
              cmake -S src -B build-cuda -DAWAVE_MODE=CUDA -DCMAKE_BUILD_TYPE=Release;
              cmake --build build-cuda -j;
            fi;
            if ! command -v nsys >/dev/null 2>&1; then
              echo "nsys not found in container PATH";
              exit 127;
            fi;
            mkdir -p /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys;
            nsys profile -f true --trace=cuda,nvtx,mpi --sample=none -o /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4 -- mpirun --mca coll_hcoll_enable 0 -np 4 build-cuda/awave -skip_cpu 1 -mpi 2,2,1 -shape 768,768,768 -nsteps 8 -out_period 4 -io 0 -json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4.json /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4;
            nsys stats --force-export=true --format csv --report cuda_gpu_kern_sum,mpi_event_sum,cuda_kern_exec_trace,mpi_event_trace --output /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4_stats /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4.nsys-rep;
            python3 tools/nsys_overlap_evidence.py --kernel-sum /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4_stats_cuda_gpu_kern_sum.csv --mpi-sum /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4_stats_mpi_event_sum.csv --label a100_np4 --out /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4_overlap.txt;
            cat /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys/cw2_nsys_a100_np4_overlap.txt;
            ls -lh /home/eidf018/eidf018/shared/s2792840-epcc-pvc/ASPP_CW2/aspp_26_cw2/logs/profiles/nsys;
        resources:
          requests:
            cpu: 8
            memory: 64Gi
            nvidia.com/gpu: 4
          limits:
            cpu: 8
            memory: 64Gi
            nvidia.com/gpu: 4
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB
